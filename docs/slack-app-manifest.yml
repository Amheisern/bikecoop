# Slack app for volunteer shift signup (docs/volunteer-shifts-plan.md, Phase 3).
# Create it at https://api.slack.com/apps -> Create New App -> From a manifest,
# pick the co-op workspace, and paste this file. Then Install to Workspace.
display_information:
  name: Bike Coop Shifts
  description: Sign up for St. Pete Bike Coop volunteer shifts.
features:
  bot_user:
    display_name: Bike Coop Shifts
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - users:read
      - users:read.email
settings:
  interactivity:
    is_enabled: true
    request_url: https://bikecoop-s8tg.onrender.com/api/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
